<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobi Saya - Afiqah Anata Putri Latiefah</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #e8f3ee;
            color: #2e4036;
            line-height: 1.6;
        }

        header {
            background-color: #4a6b5d;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
        }

        nav a:hover, nav a.active {
            background-color: #3b574a;
        }

        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: #2e4036;
        }

        .grid-hobi {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .card-hobi {
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        .card-hobi img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .card-hobi h3 {
            padding: 1rem;
            color: #4a6b5d;
            font-size: 1.1rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 2.5rem;
            color: #4a6b5d;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Afiqah Anata Putri Latiedah</div>
        <nav>
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="hobi.html" class="active">Hobi</a></li>
                <li><a href="sosmed.html">Media Sosial</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Hobi & Kegemaran</h1>
        
        <div class="grid-hobi">
            <!-- Hobi 1 -->
            <div class="card-hobi">
                <img src="images/gambar.jpeg">
                <h3>Menggambar</h3>
            </div>

            <!-- Hobi 2 -->
            <div class="card-hobi">
                <img src="images/lukisan.jpeg">
                <h3>Melukis</h3>
            </div>

            <!-- Hobi 3 -->
            <div class="card-hobi">
                <img src="images/kolam%20renang.jpeg">
                <h3>Berenang</h3>
            </div>

            <!-- Hobi 4 -->
            <div class="card-hobi">
                <img src="images/masakan.jpeg">
                <h3>Memasak</h3>
            </div>
        </div>

        <a href="index.html" class="back-link">&larr; Kembali ke Beranda</a>
    </main>

    <footer>
        <p>&copy; 2026 Afiqah Anata Putri Latiefah — SMKN 1 TANGERANG</p>
    </footer>

</body>
</html>
